[project]
name = "tearing-physics-suite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dask>=2026.6.0",
    "h5netcdf>=1.8.1",
    "h5py>=3.14.0",
    "jax>=0.7.1",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "netcdf4>=1.7.4",
    "numpy>=2.3.3",
    "omfit-classes>=3.2025.10.2",
    "pandas>=2.3.2",
    "pexpect>=4.9.0",
    "psutil>=7.2.2",
    "scipy>=1.16.2",
    "sympy>=1.14.0",
    "tqdm>=4.68.3",
    "uncertainties>=3.2.3",
    "xarray>=2025.9.0",
    "zarr>=3.1.6",
]

[project.scripts]
tps-build = "tearing_physics_suite.wrappers.build.build_tearing_physics_suite:main"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "cmake>=3.28.0",
    "isort>=6.0.1",
    "mypy>=1.18.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.0",
    "yamllint>=1.37.1",
]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
extend-exclude = ["claude_findings", "submodules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
# E501: long lines left as written for now; E701: one-line `if verbose: print(...)` is the house style.
ignore = ["E501", "E701"]

[tool.hatch.build.targets.wheel]
packages = ["tearing_physics_suite"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-m 'not fortran and not julia and not parallel and not slow'"
markers = [
    "fortran: runs RDCON/STRIDE/PEST3 (compute node)",
    "julia: runs jGPEC (compute node)",
    "parallel: uses a multiprocessing pool (>= 2 CPUs)",
    "slow: long-running (input scans)",
]
