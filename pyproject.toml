[project]
name = "tearing-physics-suite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.14.0",
    "jax>=0.7.1",
    "matplotlib>=3.10.6",
    "netcdf4>=1.7.4",
    "numpy>=2.3.3",
    "omfit-classes>=3.2025.10.2",
    "pandas>=2.3.2",
    "pexpect>=4.9.0",
    "psutil>=7.2.2",
    "scipy>=1.16.2",
    "sympy>=1.14.0",
    "uncertainties>=3.2.3",
    "xarray>=2025.9.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "cmake>=3.28.0",
    "isort>=6.0.1",
    "mypy>=1.18.1",
    "pylint>=3.3.8",
    "pytest>=8.4.2",
    "ruff>=0.13.0",
    "shellcheck-py>=0.11.0.1",
    "tomllint>=0.3.0",
    "yamllint>=1.37.1",
]

[tool.isort]
profile = "black"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
